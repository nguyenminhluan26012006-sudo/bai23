<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Liên hệ với Nguyễn Minh Luân">
    <title>Liên hệ - Nguyễn Minh Luân</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <a href="index.html">Trang chủ</a>
        <a href="about.html">Giới thiệu</a>
        <a href="projects.html">Dự án</a>
        <a href="contact.html">Liên hệ</a>
        <button id="darkToggle" class="dark-toggle" aria-label="Chuyển dark mode">🌙</button>
    </nav>

    <header>
        <h1>Liên hệ với mình</h1>
        <p>Gửi tin nhắn, mình sẽ phản hồi sớm nhất</p>
    </header>

    <section>
        <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST" class="contact-form">
            <label for="name">Họ tên</label>
            <input type="text" id="name" name="name" required placeholder="Nguyễn Minh Luân">

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required placeholder="email@example.com">

            <label for="message">Nội dung</label>
            <textarea id="message" name="message" rows="5" required placeholder="Nhập tin nhắn..."></textarea>

            <button type="submit">Gửi tin nhắn</button>
        </form>
        <p class="form-note">Form xử lý bởi Formspree (miễn phí 50 tin/tháng).</p>
    </section>

    <script src="script.js"></script>
</body>
</html>
